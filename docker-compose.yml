version: '3.8'

services:
  whatsapp-api:
    image: ${DOCKER_USERNAME}/whatsapp-api:latest
    container_name: whatsapp-api-gateway
    restart: unless-stopped

    volumes:
      - whatsapp_data:/app/.waweb

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  whatsapp_data:
    driver: local
